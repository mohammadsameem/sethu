<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9f0" />
      <stop offset="100%" stop-color="#f5e6d3" />
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#bg)" stroke="#d4af37" stroke-width="12" />
  
  <!-- Temple Silhouette Background -->
  <g opacity="0.15" fill="#5c4033">
    <path d="M120 300 h40 v-80 h-40 z M130 220 h20 v-50 h-20 z M135 170 h10 v-40 h-10 z M140 130 l5 -20 l5 20 z" />
    <rect x="180" y="240" width="30" height="60" />
    <rect x="220" y="220" width="60" height="80" />
    <rect x="290" y="250" width="40" height="50" />
  </g>

  <!-- Person / Avatar (Sethu) -->
  <!-- Body/Shoulders -->
  <path d="M 160 410 Q 160 340 250 340 Q 340 340 340 410 Z" fill="#ffffff" />
  <path d="M 215 340 L 250 390 L 285 340 Z" fill="#f4f4f4" />
  <!-- Traditional Shawl with Gold Border -->
  <path d="M 210 340 L 165 410 H 200 L 235 340 Z" fill="#d4af37" opacity="0.8" />

  <!-- Neck -->
  <path d="M 220 310 H 280 V 350 H 220 Z" fill="#c68b59" />

  <!-- Head -->
  <circle cx="250" cy="235" r="75" fill="#d19a6a" />

  <!-- Hair -->
  <path d="M 175 220 Q 170 150 250 145 Q 330 150 325 220 Q 335 180 310 150 Q 280 120 250 125 Q 210 120 185 150 Q 165 180 175 220 Z" fill="#2c1d11" />
  <!-- Hair curls & texture -->
  <circle cx="185" cy="210" r="15" fill="#2c1d11" />
  <circle cx="315" cy="210" r="15" fill="#2c1d11" />
  <circle cx="250" cy="135" r="20" fill="#2c1d11" />

  <!-- Eyes (Happy closed eyes) -->
  <path d="M 205 225 Q 220 240 235 225" fill="none" stroke="#2c1d11" stroke-width="5" stroke-linecap="round" />
  <path d="M 265 225 Q 280 240 295 225" fill="none" stroke="#2c1d11" stroke-width="5" stroke-linecap="round" />

  <!-- Smile & Beard -->
  <path d="M 225 265 Q 250 285 275 265" fill="none" stroke="#2c1d11" stroke-width="5" stroke-linecap="round" />
  <!-- Mustache -->
  <path d="M 220 255 Q 250 270 280 255 Q 260 265 250 262 Q 240 265 220 255 Z" fill="#2c1d11" />
  <!-- Beard / Jawline shadow -->
  <path d="M 185 240 Q 185 300 250 315 Q 315 300 315 240 Q 300 290 250 300 Q 200 290 185 240 Z" fill="#2c1d11" opacity="0.8" />

  <!-- Tilak (Forehead mark) -->
  <rect x="245" y="185" width="10" height="25" rx="3" fill="#ffffff" />
  <circle cx="250" cy="180" r="6" fill="#e74c3c" />

  <!-- Folded Hands (Namaste) -->
  <path d="M 220 380 L 250 310 L 280 380 L 250 370 Z" fill="#c68b59" stroke="#a06c42" stroke-width="3" />
  <line x1="250" y1="310" x2="250" y2="370" stroke="#8c5832" stroke-width="4" />

  <!-- Typography: Sethu -->
  <text x="250" y="445" font-family="serif" font-size="56" font-weight="bold" fill="#3a2518" text-anchor="middle" letter-spacing="2">Sethu</text>
  <path d="M 180 465 Q 250 480 320 465" fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round" />
</svg>
